[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-storage-sqlite"
version = "0.3.1"
description = "Isolated managed SQLite stores for Toolframe plugins"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.3.0"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-storage-sqlite"
Repository = "https://github.com/toolframe/toolframe-storage-sqlite"
Documentation = "https://github.com/toolframe/toolframe-storage-sqlite#readme"
Issues = "https://github.com/toolframe/toolframe-storage-sqlite/issues"

[project.entry-points."toolframe.plugins"]
storage-sqlite = "toolframe_storage_sqlite.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
